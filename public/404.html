<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Freebots — redirecting…</title>
    <script>
      // GitHub Pages SPA fallback. Deep links that hit a missing file land here;
      // we bounce back to index.html with the original path encoded as ?redirect=.
      (function () {
        var base = '/Botslord/';
        var path = window.location.pathname;
        var sub = path.indexOf(base) === 0 ? path.slice(base.length) : path.replace(/^\//, '');
        sub = sub.replace(/^404\.html\/?/, '');
        var qs = window.location.search || '';
        var hash = window.location.hash || '';
        var target = base + '?redirect=' + encodeURIComponent(sub + qs) + hash;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Freebots… <a href="/Botslord/">Open Freebots</a></p>
  </body>
</html>
